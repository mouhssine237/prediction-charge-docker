global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: demo-app
    metrics_path: /metrics
    static_configs:
      - targets: ["demo-app:8000"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: predictor
    static_configs:
      - targets: ["predictor:9100"]
